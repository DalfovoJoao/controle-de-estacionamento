<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parking Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Parking Management System</h1>
    <nav>
      <button type="button" onclick="showScreen('spaces')">View parking spaces</button>
      <button type="button" onclick="showScreen('registration')">Register a reservation</button>
    </nav>
  </header>

  <main>
    <section id="screen-spaces">
      <h2>Condominium Parking Spaces</h2>
      <p>The parking lot has 10 spaces, numbered from 1 to 10.</p>

      <h3>Available spaces</h3>
      <p id="available-spaces"></p>

      <h3>Registered reservations</h3>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Space</th>
              <th>License plate</th>
              <th>Owner</th>
              <th>Apartment</th>
              <th>Building</th>
              <th>Vehicle model</th>
              <th>Color</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="reservation-list"></tbody>
        </table>
      </div>
      <p id="list-message"></p>
    </section>

    <section id="screen-registration" class="hidden">
      <h2>Register a reservation</h2>
      <p>Enter the vehicle information to reserve a space.</p>

      <form id="reservation-form">
        <label for="license-plate">License plate</label>
        <input id="license-plate" type="text" maxlength="7" placeholder="ABC1D23" required>

        <label for="owner">Owner's name</label>
        <input id="owner" type="text" required>

        <label for="apartment">Apartment number</label>
        <input id="apartment" type="text" required>

        <label for="building">Building</label>
        <input id="building" type="text" required>

        <label for="model">Vehicle model</label>
        <input id="model" type="text" required>

        <label for="color">Vehicle color</label>
        <input id="color" type="text" required>

        <label for="space">Parking space (1 to 10)</label>
        <input id="space" type="number" min="1" max="10" required>

        <button type="submit">Save reservation</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
